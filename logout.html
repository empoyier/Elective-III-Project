<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signing Out... | APEX</title>
    <link rel="stylesheet" href="assets/css/apex-theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh; background:#0B132B; color:#CBD5E1; font-family:var(--apex-font-sans);">
    <div style="text-align:center;">
        <span class="brand-badge" style="font-size:24px; padding:6px 14px;">APEX</span>
        <h2 style="color:#FFFFFF; margin-top:16px;">Signing out...</h2>
        <p style="color:#94A3B8; font-size:14px;">Clearing secure session credentials</p>
    </div>
    <script>
        (async () => {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            window.location.href = 'index.html';
        })();
    </script>
</body>
</html>
