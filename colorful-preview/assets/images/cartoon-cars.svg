<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background sky -->
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Blue car body gradient -->
    <linearGradient id="blueCarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0078D7"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>

    <!-- Orange car body gradient -->
    <linearGradient id="orangeCarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Glass gradient -->
    <linearGradient id="windshieldGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Wheel gradient -->
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Rim gradient -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="800" fill="url(#bgSky)"/>

  <!-- Sun -->
  <circle cx="680" cy="140" r="60" fill="#FDE047" stroke="#FACC15" stroke-width="4"/>

  <!-- Minimal Cartoon Clouds -->
  <path d="M120 180 q25 -30 60 -10 q30 -40 70 -10 q40 0 40 30 q-5 25 -35 25 l-110 0 q-30 0 -25 -35 z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M480 130 q20 -25 50 -8 q25 -30 55 -8 q30 0 30 25 q-5 20 -30 20 l-90 0 q-20 0 -15 -29 z" fill="#FFFFFF" opacity="0.8"/>

  <!-- Distant stylized hills -->
  <path d="M0 550 Q 200 480 400 520 T 800 530 L 800 800 L 0 800 Z" fill="#94A3B8" opacity="0.4"/>
  <path d="M0 580 Q 250 510 500 560 T 800 570 L 800 800 L 0 800 Z" fill="#64748B" opacity="0.3"/>

  <!-- Road / Ground -->
  <rect x="0" y="580" width="800" height="220" fill="#1E293B"/>
  <rect x="0" y="580" width="800" height="12" fill="#0078D7"/>
  <!-- Road Dash Markings -->
  <line x1="40" y1="710" x2="140" y2="710" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" stroke-dasharray="70, 50"/>
  <line x1="240" y1="710" x2="340" y2="710" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
  <line x1="440" y1="710" x2="540" y2="710" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
  <line x1="640" y1="710" x2="740" y2="710" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>

  <!-- ================= CARTOON CAR 2: Friendly Orange Compact Hatchback (Background) ================= -->
  <g transform="translate(100, 370) scale(0.65)" filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="260" cy="270" rx="220" ry="22" fill="#0F172A" opacity="0.4"/>
    
    <!-- Body -->
    <path d="M 60 210 Q 70 140 130 110 Q 180 80 280 80 Q 380 80 410 140 L 450 170 Q 470 190 460 220 L 60 220 Z" 
          fill="url(#orangeCarGrad)" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Roof / Window -->
    <path d="M 140 115 Q 180 92 270 92 Q 350 92 375 140 L 140 140 Z" 
          fill="url(#windshieldGlass)" stroke="#0F172A" stroke-width="4"/>
    
    <!-- Headlight -->
    <ellipse cx="440" cy="180" rx="14" ry="18" fill="#FEF08A" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Wheels -->
    <g transform="translate(140, 220)">
      <circle cx="0" cy="0" r="45" fill="url(#wheelGrad)" stroke="#0F172A" stroke-width="5"/>
      <circle cx="0" cy="0" r="24" fill="url(#rimGrad)" stroke="#0F172A" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#0F172A"/>
    </g>
    <g transform="translate(370, 220)">
      <circle cx="0" cy="0" r="45" fill="url(#wheelGrad)" stroke="#0F172A" stroke-width="5"/>
      <circle cx="0" cy="0" r="24" fill="url(#rimGrad)" stroke="#0F172A" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#0F172A"/>
    </g>
  </g>

  <!-- ================= CARTOON CAR 1: Hero Windows BSoD Blue Modern Sedan / Sports Coupe ================= -->
  <g transform="translate(180, 390)" filter="url(#shadow)">
    <!-- Car Ground Shadow -->
    <ellipse cx="280" cy="275" rx="270" ry="25" fill="#0F172A" opacity="0.45"/>

    <!-- Main Car Body lower section -->
    <path d="M 30 200 
             Q 35 150 90 140 
             L 170 135 
             Q 220 70 310 65 
             L 420 65 
             Q 480 70 515 135 
             L 570 150 
             Q 610 170 600 215 
             L 585 240 
             L 30 240 
             Z" 
          fill="url(#blueCarGrad)" 
          stroke="#0F172A" 
          stroke-width="7" 
          stroke-linejoin="round"/>

    <!-- Front & Rear Wheel Arches -->
    <path d="M 100 240 A 62 62 0 0 1 224 240" fill="#0F172A"/>
    <path d="M 400 240 A 62 62 0 0 1 524 240" fill="#0F172A"/>

    <!-- Cartoon Eyes / Headlight Window (Expressive automotive style) -->
    <!-- Front Windshield -->
    <path d="M 320 80 
             L 415 80 
             Q 460 85 485 135 
             L 320 135 
             Z" 
          fill="url(#windshieldGlass)" 
          stroke="#0F172A" 
          stroke-width="5" 
          stroke-linejoin="round"/>
    
    <!-- Rear Cabin Window -->
    <path d="M 185 135 
             Q 225 85 295 80 
             L 295 135 
             Z" 
          fill="url(#windshieldGlass)" 
          stroke="#0F172A" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Window Glare Reflection Accents -->
    <polygon points="340,90 365,90 335,130 315,130" fill="#FFFFFF" opacity="0.7"/>
    <polygon points="380,90 405,90 375,130 355,130" fill="#FFFFFF" opacity="0.7"/>

    <!-- Door Line & Handle -->
    <path d="M 308 80 L 308 230" stroke="#0F172A" stroke-width="4"/>
    <rect x="325" y="150" width="32" height="8" rx="4" fill="#0F172A"/>

    <!-- Dynamic Speed/Style Body Character Crease -->
    <path d="M 70 175 Q 300 160 550 175" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 50 195 Q 300 180 570 195" stroke="#005A9E" stroke-width="4" stroke-linecap="round"/>

    <!-- Friendly Cartoon Front Headlight (Big, glowing, playful) -->
    <ellipse cx="575" cy="180" rx="18" ry="24" fill="#FEF08A" stroke="#0F172A" stroke-width="5"/>
    <ellipse cx="578" cy="178" rx="8" ry="12" fill="#FFFFFF" opacity="0.9"/>

    <!-- Cartoon Rear Taillight -->
    <path d="M 32 175 Q 45 175 42 195 L 30 195 Z" fill="#EF4444" stroke="#0F172A" stroke-width="4"/>

    <!-- Front Bumper & Smile Grille -->
    <path d="M 565 215 Q 585 225 580 235 L 545 235 Z" fill="#0F172A"/>
    <ellipse cx="550" cy="225" rx="12" ry="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>

    <!-- Rear Wheel -->
    <g transform="translate(162, 240)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="56" fill="url(#wheelGrad)" stroke="#0F172A" stroke-width="7"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="32" fill="url(#rimGrad)" stroke="#0F172A" stroke-width="4"/>
      <!-- Rim Spokes -->
      <circle cx="0" cy="0" r="12" fill="#0078D7" stroke="#0F172A" stroke-width="3"/>
      <line x1="0" y1="-32" x2="0" y2="32" stroke="#0F172A" stroke-width="4"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#0F172A" stroke-width="4"/>
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#0F172A" stroke-width="4"/>
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#0F172A" stroke-width="4"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(462, 240)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="56" fill="url(#wheelGrad)" stroke="#0F172A" stroke-width="7"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="32" fill="url(#rimGrad)" stroke="#0F172A" stroke-width="4"/>
      <!-- Rim Spokes -->
      <circle cx="0" cy="0" r="12" fill="#0078D7" stroke="#0F172A" stroke-width="3"/>
      <line x1="0" y1="-32" x2="0" y2="32" stroke="#0F172A" stroke-width="4"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#0F172A" stroke-width="4"/>
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#0F172A" stroke-width="4"/>
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#0F172A" stroke-width="4"/>
    </g>
  </g>

  <!-- Speed Motion Lines behind the car -->
  <line x1="120" y1="480" x2="160" y2="480" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="80" y1="520" x2="140" y2="520" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <line x1="110" y1="550" x2="155" y2="550" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Cheerful Birds -->
  <path d="M 240 100 Q 250 85 260 100 Q 270 85 280 100" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M 310 120 Q 318 108 326 120 Q 334 108 342 120" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
</svg>
