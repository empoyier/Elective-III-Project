<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <title>Register Customer Account | APEX</title>
    <link rel="stylesheet" href="assets/css/apex-theme.css">
    <link rel="stylesheet" href="assets/css/customer.css">
    <style>
        body {
            min-height: 100vh;
            background: #FFFFFF;
        }

        .auth-main {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(400px, 0.9fr);
            align-items: stretch;
        }

        .auth-brand-panel {
                position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(40px, 7vw, 100px);
            background: #EEF5FF;
            text-align: center;
        }

        .auth-brand-panel::after {
            content: "";
            position: absolute;
            top: 0;
            right: -90px;
            width: 180px;
            height: 100%;
            border-radius: 50%;
            background: #FFFFFF;
            pointer-events: none;
        }

        .auth-brand {
            display: block;
            width: min(100%, 420px);
            height: auto;
            margin: 0 auto 32px;
        }

        .auth-brand-title {
            max-width: 560px;
            color: #0F172A;
            font-size: clamp(28px, 3.2vw, 44px);
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -1.2px;
            margin-bottom: 14px;
        }

        .auth-brand-copy {
            max-width: 430px;
            color: #475569;
            font-size: 16px;
            line-height: 1.7;
        }

        .auth-form-panel {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(28px, 5vw, 72px);
            background: #FFFFFF;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
        }

        .google-signin-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 11px 12px;
            background: #FFFFFF;
            color: #1F2937;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .google-signin-btn:hover {
            background: #F8FAFC;
        }

        .google-signin-btn:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
            color: var(--apex-text-muted);
            font-size: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--apex-border-subtle);
        }

        .auth-card {
            border-top: 4px solid var(--apex-primary);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        }

        @media (max-width: 1024px) {
            .auth-main {
                grid-template-columns: 1fr;
            }

            .auth-brand-panel {
                padding: 44px 24px 28px;
            }

            .auth-brand-panel::after {
                display: none;
            }

            .auth-brand {
                width: min(78vw, 380px);
                margin-bottom: 20px;
            }

            .auth-brand-title {
                font-size: 28px;
            }

            .auth-brand-copy {
                font-size: 14px;
            }

            .auth-form-panel {
                padding: 24px 20px 48px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
</head>
<body>
<main class="auth-main">
<section class="auth-brand-panel" aria-label="APEX Car Rental Services">
    <a href="index.html" aria-label="APEX Car Rental home">
        <img class="auth-brand" src="assets/images/apex-new-logo.png" alt="APEX Car Rental Services">
    </a>
    <h2 class="auth-brand-title">Start your next journey.</h2>
    <p class="auth-brand-copy">Create an account to reserve a vehicle and keep your booking details close at hand.</p>
</section>
<section class="auth-form-panel">
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-header">
            <h1 class="card-title" style="font-size:18px;">Create an APEX Account</h1>
        </div>
        <div class="card-body">
            <div id="reg-alert" class="alert alert-danger" style="display:none;"></div>

            <button type="button" id="google-signin" class="google-signin-btn">
                <svg aria-hidden="true" viewBox="0 0 48 48" width="18" height="18">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.93 46.98 31.7 46.98 24.55z"/>
                    <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.88.93 7.55 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.9 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>
            <div class="auth-divider" aria-hidden="true">or create an account with email</div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg_name">Full Legal Name *</label>
                    <input type="text" name="name" id="reg_name" class="form-control" required placeholder="e.g. Juan Dela Cruz">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg_email">Email Address *</label>
                    <input type="email" name="email" id="reg_email" class="form-control" required placeholder="juan@domain.ph">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg_password">Password (Minimum 6 characters) *</label>
                    <input type="password" name="password" id="reg_password" class="form-control" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg_phone">Mobile Phone *</label>
                    <input type="text" name="phone" id="reg_phone" class="form-control" required placeholder="+63 917 123 4567">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg_license">Philippine LTO Driver's License Number</label>
                    <input type="text" name="license_number" id="reg_license" class="form-control" placeholder="e.g. N01-12-123456">
                </div>

                <button type="submit" id="btn-reg" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">
                    Complete Registration &rarr;
                </button>
            </form>

            <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--apex-border-subtle); text-align:center; font-size:13px;">
                Already have an account? <a href="login.html" style="font-weight:700;">Sign In</a>
            </div>
        </div>
    </div>
</div>
</section>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const user = await getCurrentUser();
    if (user) {
        window.location.href = 'my-bookings.html';
        return;
    }

    const alertEl = document.getElementById('reg-alert');
    const googleButton = document.getElementById('google-signin');
    googleButton.addEventListener('click', async () => {
        googleButton.disabled = true;
        googleButton.textContent = 'Redirecting to Google...';
        try {
            await signInWithGoogle();
        } catch (error) {
            console.error('Google sign-in failed:', error);
            alertEl.textContent = error.message || 'Could not start Google sign-in.';
            alertEl.style.display = 'block';
            googleButton.disabled = false;
            googleButton.textContent = 'Continue with Google';
        }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg_name').value.trim();
        const email = document.getElementById('reg_email').value.trim();
        const password = document.getElementById('reg_password').value;
        const phone = document.getElementById('reg_phone').value.trim();
        const licenseNumber = document.getElementById('reg_license').value.trim();

        const submitBtn = document.getElementById('btn-reg');
        let accountCreated = false;

        alertEl.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering account...';

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        name: name,
                        phone: phone,
                        license_number: licenseNumber,
                        role: 'customer'
                    }
                }
            });

            if (error) throw error;
            accountCreated = Boolean(data.user);

            if (data.user) {
                const { error: profileError } = await supabaseClient.from('users').upsert({
                    id: data.user.id,
                    email: email,
                    name: name,
                    phone: phone,
                    license_number: licenseNumber,
                    role: 'customer',
                    status: 'active'
                });
                if (profileError) {
                    throw new Error(`Account created, but the customer profile could not be saved: ${profileError.message}`);
                }
            }

            if (data.session) {
                window.location.href = 'my-bookings.html';
                return;
            }

            alertEl.className = 'alert alert-success';
            alertEl.textContent = 'Account created. Check your email to confirm your address, then sign in.';
            alertEl.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Confirmation Email Sent';
        } catch (err) {
            alertEl.textContent = err.message || 'Registration failed.';
            alertEl.style.display = 'block';
            if (accountCreated) {
                submitBtn.textContent = 'Account Created';
            } else {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Registration →';
            }
        }
    });
});
</script>
</body>
</html>
